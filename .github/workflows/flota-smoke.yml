name: DeliveryYa Flota - controles de regresion

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Sintaxis y contratos criticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pruebas sin credenciales ni operaciones reales
        run: |
          node --version
          node --test tests/*.test.mjs
          node scripts/smoke.mjs
