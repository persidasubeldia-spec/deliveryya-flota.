name: Publicar DeliveryYa Flota en Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener versión actual
        uses: actions/checkout@v4
      - name: Preparar directorio público, sin DEMO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in index.html central.html motorista.html tienda-alta.html tienda-registro.html reporte-tienda.html manifest.webmanifest sw.js; do
            test -s "$f" || { echo "::error::Falta $f"; exit 1; }
            cp "$f" dist/
          done
          # Mantener archivos HTML en la raíz para evitar error 404.
          # No incluir simuladores, repositorio, auditorías ni archivos secretos.
          if find dist -iname '*demo*' -o -iname '*simulacr*' | grep .; then
            echo "::error::Contenido DEMO detectado"
            exit 1
          fi
      - name: Validar JavaScript de páginas
        run: node scripts/smoke.mjs
      - name: Comprobar credenciales de despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Publicar al proyecto Cloudflare existente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f47a55b7e74f1e7ff09975ebe7f6a1a1
        run: npx --yes wrangler@4 pages deploy dist --project-name=deliveryya-flota --branch=main
      - name: Verificar página publicada
        shell: bash
        run: |
          set -euo pipefail
          for route in index.html central.html motorista.html; do
            ok=false
            for intento in 1 2 3 4 5; do
              if curl --fail --location --silent --show-error --max-time 20 "https://deliveryya-flota.pages.dev/$route" --output /tmp/deliveryya-verify.html && grep -qi 'DeliveryYa' /tmp/deliveryya-verify.html; then
                echo "Verificado: $route"
                ok=true
                break
              fi
              sleep 4
            done
            if [ "$ok" != true ]; then
              echo "::error::No responde correctamente $route"
              exit 1
            fi
          done

      - name: Probar resolución del enlace real de Google Maps
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 35 -o /tmp/maps-response.json -w '%{http_code}' -X POST 'https://deliveryya-flota.pages.dev/api/resolve-map' -H 'Content-Type: application/json' --data '{"url":"https://maps.app.goo.gl/zrWvmjztNjgndb1o6?g_st=ac"}')
          echo "Estado resolutor: $code"
          cat /tmp/maps-response.json
          echo
          if [ "$code" != 200 ]; then
            echo "::warning::El enlace real todavía no resuelve; no darlo por solucionado."
          fi

      - name: Diagnosticar redirección de Maps sin alterar pedidos
        shell: bash
        run: |
          curl -I -L -sS --max-time 15 -o /tmp/google-headers -w 'URL FINAL: %{url_effective}\nHTTP: %{http_code}\n' 'https://maps.app.goo.gl/zrWvmjztNjgndb1o6?g_st=ac' || true
          grep -Ei '^(HTTP/|location:|content-type:)' /tmp/google-headers | tail -15 || true
