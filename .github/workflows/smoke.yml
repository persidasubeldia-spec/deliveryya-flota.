name: DeliveryYa Flota - Verificación básica
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificacion-estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxis y pantallas esenciales
        run: node scripts/smoke.mjs
      - name: Empaquetar código fuente exacto sin secretos de acciones
        if: github.event_name == 'push'
        run: |
          git archive --format=zip --output=DELIVERYYA_FUENTE.zip HEAD
      - name: Subir respaldo fuente para migración
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deliveryya-migration-source
          path: DELIVERYYA_FUENTE.zip
          retention-days: 3
