name: DeliveryYa Flota - Verificación básica
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificacion-estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxis y pantallas esenciales
        run: node scripts/smoke.mjs
