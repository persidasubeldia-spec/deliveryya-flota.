<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeliveryYa · Activar tienda</title><style>body{font:15px system-ui;background:#f3f6fb;margin:0;color:#20364e}header{background:#153457;color:#fff;padding:20px}main{max-width:580px;margin:25px auto;padding:10px}.card{background:white;border:1px solid #dfe7f0;border-radius:14px;padding:23px;box-shadow:0 4px 20px #18385b14}label{display:block;margin:12px 0 5px;font-weight:600}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #c6d1e0;border-radius:9px}button{padding:12px;border:0;border-radius:9px;background:#1465b8;color:white;cursor:pointer;margin:14px 6px 0 0}.muted{color:#62738c}a{color:#1465b8}</style></head><body><header><strong>DeliveryYa Flota</strong><div>Activación de tienda autorizada</div></header><main><div class="card"><h2>Bienvenida a DeliveryYa</h2><p>Este enlace fue emitido por la administración de la flota. Usá exactamente el correo al que se envió la invitación.</p><label>Correo electrónico</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="new-password"><p><button id="register">Crear mi cuenta</button><button id="login">Ya tengo cuenta</button></p><p id="msg" class="muted"></p><p><a href="/">Abrir App Tienda</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://sxhuvjvbqkovivcbisrn.supabase.co','sb_publishable_aKiJpn8HK3tpqRuQkNc3CQ_YUi9EnGv',{auth:{storageKey:'dyf-auth-tienda',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('invite');
async function redeem(){if(!token){$('msg').textContent='Falta el enlace de invitación';return}const{data:{session}}=await db.auth.getSession();if(!session){$('msg').textContent='Ingresá o creá la cuenta con el correo autorizado';return}const{data,error}=await db.rpc('flota_aceptar_tienda_propietaria',{p_token:token});if(error){$('msg').textContent='No se pudo activar: '+error.message;return}history.replaceState(null,'',location.pathname);$('msg').innerHTML='Tienda '+String(data).replace(/[^A-Za-z0-9]/g,'')+' activada. <a href="/">Entrar a App Tienda</a>'}
$('register').onclick=async()=>{if(!token){$('msg').textContent='Enlace de invitación requerido';return}if($('password').value.length<8){$('msg').textContent='Usá una contraseña de 8 caracteres o más';return}const{data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.href}});if(error){$('msg').textContent=error.message;return}if(data.session){await redeem();return}$('msg').textContent='Revisá tu correo, confirmá la cuenta y volvé a abrir este enlace de invitación'};
$('login').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('msg').textContent=error.message;return}await redeem()};redeem();
</script></body></html>
