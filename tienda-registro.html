<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeliveryYa Flota — Solicitar registro de tienda</title><style>body{font:16px system-ui;background:#f2f5fb;color:#18304d;margin:0}header{background:#163f74;color:white;padding:20px}main{max-width:560px;margin:26px auto;padding:14px}.card{background:white;border:1px solid #dce5f1;border-radius:14px;padding:24px;box-shadow:0 4px 20px #1232}label{display:block;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #abbdd1;border-radius:8px}button{background:#1765ba;color:white;border:0;border-radius:9px;padding:12px 17px;margin:7px 5px 7px 0;cursor:pointer}button:disabled{opacity:.6}a{color:#1765ba}#status{white-space:pre-line;line-height:1.5}</style></head><body><header><strong>DeliveryYa Flota</strong><div>Registro independiente de tiendas</div></header><main><div class="card"><h2>Crear cuenta de tienda</h2><p>Ingresá tu correo y contraseña. Te avisaremos cuando la administración apruebe tu acceso.</p><label>Correo electrónico<input id="email" type="email" autocomplete="email"></label><label>Contraseña (mínimo 8 caracteres)<input id="password" type="password" autocomplete="new-password"></label><button id="register">Registrarme</button><button id="login">Ya tengo cuenta</button><p id="status" role="status"></p><p><a href="/">Volver a la App Tienda</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://sxhuvjvbqkovivcbisrn.supabase.co','sb_publishable_aKiJpn8HK3tpqRuQkNc3CQ_YUi9EnGv'),$=id=>document.getElementById(id);
const report=s=>$('status').textContent=s;
async function sendRequest(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){report('Confirmá tu correo y luego ingresá con tu contraseña para completar el registro.');return;}
 const {error}=await db.rpc('flota_solicitar_alta_tienda_simple');
 if(error){report('No se pudo completar: '+error.message);return;}
 report('Registro recibido. Tu tienda está pendiente de aprobación. No necesitás completar otros datos ahora.');
}
$('register').onclick=async()=>{
 const b=$('register');b.disabled=true;
 try{
 const email=$('email').value.trim(),password=$('password').value;
 if(!/^\\S+@\\S+\\.\\S+$/.test(email)||password.length<8){report('Ingresá un correo válido y una contraseña de al menos 8 caracteres.');return;}
 const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/tienda-registro.html'}});
 if(error){report('No se pudo registrar: '+error.message);return;}
 if(data.session)await sendRequest();
 else report('Cuenta creada. Revisá tu correo y confirmá el enlace. Después ingresá con tu correo y contraseña para completar la solicitud.');
 }finally{b.disabled=false;}
};
$('login').onclick=async()=>{
 const b=$('login');b.disabled=true;
 try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){report('No se pudo ingresar: '+error.message);return;}await sendRequest();}
 finally{b.disabled=false;}
};
async function check(){const {data,error}=await db.rpc('flota_mis_solicitudes_tienda');if(!error&&data?.length)report(data[0].estado==='aprobada'?'Tu tienda fue aprobada. Ya podés entrar a la App Tienda.':data[0].estado==='rechazada'?'Tu solicitud no fue aprobada.':'Tu registro está pendiente de aprobación.');}
check();
</script></body></html>
