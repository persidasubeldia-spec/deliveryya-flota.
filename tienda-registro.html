<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeliveryYa Flota — Solicitar registro de tienda</title><style>body{font:16px system-ui;background:#f2f5fb;color:#18304d;margin:0}header{background:#163f74;color:white;padding:20px}main{max-width:560px;margin:26px auto;padding:14px}.card{background:white;border:1px solid #dce5f1;border-radius:14px;padding:24px;box-shadow:0 4px 20px #1232}label{display:block;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #abbdd1;border-radius:8px}button{background:#1765ba;color:white;border:0;border-radius:9px;padding:12px 17px;margin:7px 5px 7px 0;cursor:pointer}button:disabled{opacity:.6}a{color:#1765ba}#status{white-space:pre-line;line-height:1.5}</style></head><body><header><strong>DeliveryYa Flota</strong><div>Registro independiente de tiendas</div></header><main><div class="card"><h2>Solicitá incorporar tu tienda</h2><p>Podés registrarte sin invitación. La flota revisará la solicitud antes de habilitar la carga de pedidos.</p><label>Nombre comercial<input id="name" autocomplete="organization"></label><label>Responsable<input id="owner" autocomplete="name"></label><label>Teléfono WhatsApp<input id="phone" autocomplete="tel"></label><label>Dirección de la tienda<input id="address" autocomplete="street-address"></label><hr><label>Tu correo<input id="email" type="email" autocomplete="email"></label><label>Contraseña (mínimo 8 caracteres)<input id="password" type="password" autocomplete="new-password"></label><button id="register">Crear cuenta</button><button id="login">Ya tengo cuenta</button><button id="send">Enviar solicitud</button><p id="status" role="status"></p><p><a href="/">Volver a la App Tienda</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://sxhuvjvbqkovivcbisrn.supabase.co','sb_publishable_aKiJpn8HK3tpqRuQkNc3CQ_YUi9EnGv'),$=id=>document.getElementById(id);
const report=s=>$('status').textContent=s;
$('register').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email.includes('@')||password.length<8){report('Ingresá un correo válido y contraseña de al menos 8 caracteres.');return}const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/tienda-registro.html'}});report(error?'No se creó la cuenta: '+error.message:data.session?'Cuenta creada. Completá la solicitud.':'Revisá tu correo y confirmá tu cuenta. Después volvé a esta página e iniciá sesión para enviar tu solicitud.')};
$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});report(error?'No se pudo iniciar sesión: '+error.message:'Sesión iniciada. Ya podés enviar tu solicitud.');if(!error)check()};
$('send').onclick=async()=>{const b=$('send');b.disabled=true;try{const {data:{session}}=await db.auth.getSession();if(!session){report('Primero creá tu cuenta, confirmá el correo e iniciá sesión.');return}const {data,error}=await db.rpc('flota_solicitar_alta_tienda',{p_nombre:$('name').value,p_responsable:$('owner').value,p_telefono:$('phone').value,p_direccion:$('address').value});report(error?'No se registró: '+error.message:'Solicitud recibida. Estado: pendiente de aprobación. Te habilitaremos cuando la administración apruebe la tienda.');}finally{b.disabled=false}};
async function check(){const {data,error}=await db.rpc('flota_mis_solicitudes_tienda');if(!error&&data?.length)report('Tu solicitud de '+data[0].nombre+' está '+data[0].estado+'.'+(data[0].estado==='aprobada'?' Ya podés entrar a la App Tienda.':''));}
check();
</script></body></html>
