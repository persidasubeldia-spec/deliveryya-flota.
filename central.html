<script id="dyNotaJs">window.dyNota=function(o){if(!o)return '';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ob=String(o.observaciones||'').trim(),pr=String(o.producto||'').trim();if(!ob&&!pr)return '';return '<div class="dy-nota">'+(ob?'<span class="dy-obs">📝 '+e(ob)+'</span>':'')+(pr?'<span class="dy-prod">📦 '+e(pr)+'</span>':'')+'</div>'};window.dyNotaTxt=function(o){const ob=String(o&&o.observaciones||'').trim();return ob?' · 📝 '+ob:''};</script>
<script id="dySesion">/* Una sola sesión para todas las apps (antes había una copia por app y Supabase las cortaba al renovarse). */
(function(){try{var K='dyf-auth',V=['dyf-auth-app','dyf-auth-central','dyf-auth-tienda','dyf-auth-motorista'];
if(!localStorage.getItem(K)){var best=-1,bk=null,ult=localStorage.getItem('dyf-ultimo-rol');
V.forEach(function(k){var v=localStorage.getItem(k);if(!v)return;try{var s=JSON.parse(v);if(!s||!s.refresh_token)return;var e=Number(s.expires_at)||0;if(k==='dyf-auth-'+ult)e+=1;if(e>best){best=e;bk=k}}catch(x){}});
if(bk){localStorage.setItem(K,localStorage.getItem(bk));var r=bk.slice(9);if(!ult&&r!=='app')localStorage.setItem('dyf-ultimo-rol',r)}}
V.forEach(function(k){localStorage.removeItem(k);localStorage.removeItem(k+'-code-verifier')})}catch(e){}})();</script>
<script id="dyRol">
/* Lleva la cuenta al panel que le corresponde según su correo (Central, Motorista o Tienda). */
window.dyIrAlRol=async function(db,claveActual,actual,{nuevaVaTienda=false}={}){
 try{const {data:{session}}=await db.auth.getSession();if(!session)return false;const uid=session.user.id;
 const [c,m,t]=await Promise.all([db.from('flota_usuarios').select('rol').eq('usuario_id',uid).eq('activo',true).limit(1),db.from('motoristas').select('id').eq('usuario_id',uid).eq('activo',true).limit(1),db.from('tienda_miembros').select('tienda_id').eq('usuario_id',uid).eq('activo',true).limit(1)]);
 const roles=[];if(c.data?.length)roles.push('central');if(m.data?.length)roles.push('motorista');if(t.data?.length)roles.push('tienda');
 if(roles.includes(actual))return false;
 let dest=roles[0];if(!dest&&nuevaVaTienda)dest='tienda';if(!dest)return false;
 const D={central:['dyf-auth-central','/central'],motorista:['dyf-auth-motorista','/motorista'],tienda:['dyf-auth-tienda','/']};
 
 try{localStorage.setItem('dyf-ultimo-rol',dest)}catch(e){}
 document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;background:#0b2a5ee6;color:#fff;display:flex;align-items:center;justify-content:center;font:600 18px system-ui;z-index:99999">Abriendo tu panel…</div>');
 location.replace(D[dest][1]);return true}catch(e){console.warn('dyIrAlRol',e);return false}};
</script><script>
(function(){function etiquetar(){document.querySelectorAll('#content table').forEach(t=>{const th=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());if(!th.length)return;t.classList.add('dy-cards');t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(!td.hasAttribute('data-label'))td.setAttribute('data-label',th[i]||'')}))})}

 }

 if(tipo==='pagar'||tipo==='cobrar'||tipo==='tienda'){

 });

 });
 cover.querySelectorAll('[data-gwa]').forEach(b=>b.onclick=async()=>{

     const msg='DeliveryYa Flota · Rendición '+(g.tienda.codigo||'')+' · '+g.tienda.nombre_comercial+
       '\nFecha: '+d.split('-').reverse().join('/')+'\n'+(g.neto>=0?'Saldo calculado a rendir: ':'Saldo calculado a cobrar: ')+money(Math.abs(g.neto))+

     if(navigator.canShare&&navigator.canShare({files:[pdf]})){

     }else{
       const url=URL.createObjectURL(pdf),a=document.createElement('a');a.href=url;a.download=pdf.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);

 const parseRouteOrigin=raw=>{
  const t=String(raw||'').trim();
  if(!t)return null;
  const match=t.match(/(?:@|[?&](?:q|query)=|^)(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!match)throw Error('Punto de salida inválido. Pegá latitud,longitud o enlace de Google Maps.');
  const lat=Number(match[1]),lng=Number(match[2]);
  if(Math.abs(lat)>90||Math.abs(lng)>180)throw Error('Las coordenadas de salida están fuera de rango.');
  return {lat,lng};
 };

// Lógica financiera por pedido, desde la mirada de la tienda (misma regla que reporte-tienda):
//  entregado + pendiente       → la flota cobró mercadería+envío: debe la MERCADERÍA a la tienda
//  entregado + producto_pagado → la flota cobró solo el envío: no debe mercadería
//  entregado + todo_pagado     → el cliente pagó todo a la tienda: la TIENDA debe el ENVÍO a la flota
//  rechazado                   → no hay mercadería; si el envío quedó a cargo de la tienda, la tienda debe ese saldo
function rdLineaTienda(m,p,r){
 const ent=p.estado==='entregado',rej=m.es_rechazo_facturable===true||p.estado==='rechazado';
 const merc=ent&&p.modalidad_pago==='pendiente'?Number(m.monto_mercaderia||0):0;
 const envCliente=ent&&p.modalidad_pago!=='todo_pagado'?Number(m.monto_delivery||0):0;
 let debeTienda=0,nota='';
 if(ent&&p.modalidad_pago==='todo_pagado'){debeTienda=Number(m.monto_delivery||0);nota='Envío ya cobrado por la tienda'}
 else if(rej){if(r&&r.responsable_pago==='tienda'){debeTienda=Number(r.importe_pendiente||0);nota='Rechazo: envío a cargo de la tienda'}else if(r){nota='Rechazo: envío '+(r.responsable_pago==='cliente'?'pagado por el cliente ('+rdGs(r.importe_cobrado)+')':'pendiente de definir')}else nota='Rechazo sin detalle'}
 else if(ent&&p.modalidad_pago==='pendiente')nota='Cobrado '+(Number(m.transferencia_cobrada||0)?'por transferencia':'en efectivo');
 else if(ent)nota='Producto pagado: solo envío';
 return {merc,envCliente,debeTienda,nota,rej,ent};
}
function rdTiendas(d){

  const p=d.porPedido.get(m.pedido_id);if(!p)continue;
  const t=asegurar(p.tienda_id),l=rdLineaTienda(m,p,d.rech.get(p.id));

 // Visibilidad operativa: pedidos creados en la fecha, aun sin movimientos.
 // Este campo NO modifica saldos, comisiones ni cierres.
 for(const p of d.porPedido.values()){
  if(!p.tienda_id)continue;

  const t=asegurar(p.tienda_id);t.pedidos.push(p);
 }
 for(const t of out.values()){
  t.filas.sort((a,b)=>String(a.p.turno).localeCompare(String(b.p.turno))||(a.p.numero_general??9999)-(b.p.numero_general??9999));

}

async function rdPdf(t,fecha){

  no_responde:{nombre:'No responde',rgb:[255,247,213],color:[145,97,11]},
  no_recibio:{nombre:'No recibio',rgb:[255,237,215],color:[160,75,21]},
  pasa_manana:{nombre:'Pasa manana',rgb:[226,240,255],color:[25,82,158]},
  pendiente:{nombre:'Pendiente',rgb:[239,241,244],color:[74,85,102]},
  cancelado:{nombre:'Cancelado',rgb:[224,227,233],color:[64,72,89]}
 };

  entregado:'Finalizado; no recargar',rechazado:'Revisar motivo; no duplicar',
  no_responde:'Reintentar contacto',no_recibio:'Consultar al cliente',
  pasa_manana:'Verificar traslado; no duplicar',pendiente:'Continua en gestion',
  cancelado:'Finalizado; confirmar nueva solicitud'
 };

 }

  txt((codigo+' · '+nombre).slice(0,46),W-86,13,10,true,[24,52,84]);

   txt('Fecha operativa: '+fechaTexto,M,31,9,true);

 const colores={total:[228,239,255],entregado:tonos.entregado.rgb,rechazado:tonos.rechazado.rgb,no_responde:tonos.no_responde.rgb,no_recibio:tonos.no_recibio.rgb,pasa_manana:tonos.pasa_manana.rgb,pendiente:tonos.pendiente.rgb,cancelado:tonos.cancelado.rgb};
 const etiquetas={total:'TOTAL',entregado:'ENTREGADOS',rechazado:'RECHAZADOS',no_responde:'NO RESPONDE',no_recibio:'NO RECIBIO',pasa_manana:'PASA MANANA',pendiente:'PENDIENTES',cancelado:'CANCELADOS'};

 });
 txt('Detalle de pedidos  ·  Estado actual  ·  Movimiento = asiento financiero registrado',M,70,9,true);

    String(p.numero_general??'—'),String(p.nombre_cliente||'—'),String(p.producto||'—'),label(p),

 });

   }

  },

 });
 let y=(doc.lastAutoTable?.finalY||74)+8;
 const minimo=66;
 if(y+minimo>H-16){doc.addPage();encabezado(false);y=42}
 txt('Resumen financiero (solo movimientos registrados)',M,y,11,true);y+=7;
 const financiero=[
  ['Mercaderia cobrada para la tienda (+)',t.merc],

 ];
 financiero.forEach(([lab,val])=>{txt(lab,M+3,y,9);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(29,47,72);doc.text(rdGs(val),W-M-3,y,{align:'right'});y+=7});
 const positivo=t.neto>0,negativo=t.neto<0;
 doc.setFillColor(...(positivo?[225,250,229]:negativo?[255,237,218]:[235,239,246]));
 doc.roundedRect(M,y-3,inner,13,2,2,'F');
 txt(positivo?'LA FLOTA DEBE RENDIR A LA TIENDA':negativo?'LA TIENDA DEBE PAGAR A LA FLOTA':'SIN SALDO NETO A RENDIR',M+4,y+5,10,true);

<script id="dyDespachoJs">
// Despacho con control total: Optimizar numera 1..N desde mi ubicación (no asigna);
// el jefe marca casilleros, ve el tramo en el mapa, elige moto, asigna y manda WhatsApp.
// Solo usa funciones existentes del servidor (crear ruta, reorganizar, confirmar/anexar, asignar lote).
(function(){
 const st={fecha:new Date().toLocaleDateString('sv-SE',{timeZone:'America/Asuncion'}),turno:null,filtro:'pendientes',busqueda:'',origen:null,manual:false,sel:new Set(),moto:null,map:null,g:false,objs:[],fit:false,ultimo:null,firma:''};
 const PAL=['#1765ba','#e8590c','#2b8a3e','#ae3ec9','#c92a2a','#0b7285','#5c940d','#d6336c','#f08c00','#364fc7'];
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const $$=id=>document.getElementById(id);
 const hoy=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Asuncion'});
 const km=(a,b)=>{const R=6371,x=(b.lat-a.lat)*Math.PI/180,y=(b.lng-a.lng)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
 const P=o=>({lat:Number(o.lat),lng:Number(o.lng)});
 const gps=o=>o&&o.lat!=null&&o.lng!=null&&Number.isFinite(Number(o.lat))&&Number.isFinite(Number(o.lng));
 const tur=o=>o.turno||'sin_definir';
 const fechaCarga=o=>o?.created_at?new Date(o.created_at).toLocaleDateString('sv-SE',{timeZone:'America/Asuncion'}):'';
 const fechaOperativa=o=>routes.find(x=>x.id===o.ruta_general_id)?.fecha||fechaCarga(o);
 const esFecha=o=>!!o&&fechaOperativa(o)===st.fecha;
 const editable=()=>st.fecha===hoy();
 function escogerFecha(f){if(!/^\d{4}-\d{2}-\d{2}$/.test(f)||f>hoy())return;st.fecha=f;filtroDia=f;st.sel.clear();st.moto=null;st.origen=null;st.ultimo=null;st.fit=false;pintar()}
 function moverFecha(paso){const d=new Date(st.fecha+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+paso);escogerFecha(d.toISOString().slice(0,10))}

 const FIN=['entregado','rechazado','cancelado'];
 function colorMoto(id){const act=drivers.filter(d=>d.activo);const i=act.findIndex(d=>d.id===id);const d=act[i];const c=d&&/^#[0-9a-f]{6}$/i.test(d.color_identificador||'')?d.color_identificador:null;const rep=c&&act.findIndex(x=>(x.color_identificador||'').toLowerCase()===c.toLowerCase())!==i;return (!c||rep)?PAL[(i<0?0:i)%PAL.length]:c}
 function rutaHoy(t){return routes.filter(r=>r.fecha===st.fecha&&r.turno===t&&['abierta','optimizada','en_reparto'].includes(r.estado)).sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')))[0]||null}
 function paradas(){return orders.filter(o=>esFecha(o)&&tur(o)===st.turno).sort((a,b)=>(a.numero_general??1e9)-(b.numero_general??1e9)||String(a.created_at).localeCompare(String(b.created_at)))}
 function libre(o){if(!o||!editable()||!esFecha(o)||o.estado!=='pendiente'||o.motorista_id||o.numero_general==null)return false;const r=routes.find(x=>x.id===o.ruta_general_id);return !!r&&['optimizada','en_reparto'].includes(r.estado)}
 function cercania(lista,desde){const r=[...lista],out=[];let cur=desde||P(r[0]);while(r.length){let bi=0,bd=Infinity;r.forEach((o,i)=>{const d=km(cur,P(o));if(d<bd){bd=d;bi=i}});const n=r.splice(bi,1)[0];out.push(n);cur=P(n)}return out}
 // 2-opt: deshace cruces del recorrido (camino abierto que sale del origen)
 function mejorar(ruta,origen){if(ruta.length<4)return ruta;const pts=[origen,...ruta.map(P)];let r=[...ruta],mejoro=true,vueltas=0;const D=(a,b)=>km(a,b);
  while(mejoro&&vueltas<60){mejoro=false;vueltas++;const p=[origen,...r.map(P)];for(let i=0;i<r.length-1;i++)for(let k=i+1;k<r.length;k++){const a=p[i],b=p[i+1],c=p[k+1],d=k+2<p.length?p[k+2]:null;const antes=D(a,b)+(d?D(c,d):0),despues=D(a,c)+(d?D(b,d):0);if(despues+1e-9<antes){r=[...r.slice(0,i),...r.slice(i,k+1).reverse(),...r.slice(k+1)];mejoro=true;break}}if(mejoro)continue}return r}
 function largo(lista,desde){let t=0,c=desde;lista.forEach(o=>{if(c)t+=km(c,P(o));c=P(o)});return t}
 function enlaces(ps){const g=[];for(let i=0;i<ps.length;i+=10){const t=ps.slice(i,i+10),pt=o=>Number(o.lat).toFixed(6)+','+Number(o.lng).toFixed(6);const dest=t[t.length-1],way=t.slice(0,-1);g.push({desde:t[0].numero_general,hasta:dest.numero_general,url:'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(pt(dest))+(way.length?'&waypoints='+encodeURIComponent(way.map(pt).join('|')):'')+(i>0?'&origin='+encodeURIComponent(pt(ps[i-1])):'')})}return g}
 function waUrl(d){const dg=String(d.telefono||'').replace(/\D/g,'');const phone=dg.startsWith('595')?dg:'595'+dg.replace(/^0/,'');
  const asig=orders.filter(o=>esFecha(o)&&o.motorista_id===d.id&&['pendiente','no_responde','no_recibio','pasa_manana'].includes(o.estado)).sort((a,b)=>(a.numero_general??1e9)-(b.numero_general??1e9));
  const tr=enlaces(asig.filter(gps));const lista=asig.slice(0,40).map(o=>'N.º '+(o.numero_general??'S/N')+' · '+o.nombre_cliente+(o.direccion_cliente?' · '+o.direccion_cliente:'')+(window.dyNotaTxt?dyNotaTxt(o):'')).join('\n');
  const texto='*DeliveryYa Flota* 🏍️\nHola '+d.nombre+', tenés '+asig.length+' entrega(s).\n\n*▶ Abrir la ruta en Google Maps:*\n'+tr.map(t=>(tr.length>1?'Paradas '+t.desde+'–'+t.hasta+': ':'')+t.url).join('\n')+'\n\n*Orden de entrega:*\n'+lista+(asig.length>40?'\n… y '+(asig.length-40)+' más en la app.':'')+'\n\n*Cobros y entregas:* '+location.origin+'/motorista.html';
  return 'https://api.whatsapp.com/send?phone='+phone+'&text='+encodeURIComponent(texto)}
 function msg(t,k){const m=$$('dyDMsg');if(m){m.className='msg '+(k||'');m.textContent=t}}
 function contar(t){return orders.filter(o=>esFecha(o)&&tur(o)===t&&o.estado==='pendiente'&&!o.motorista_id).length}
 function visiblesTurno(){
  let p=paradas();
  if(st.filtro==='pendientes')p=p.filter(o=>!FIN.includes(o.estado));
  if(st.filtro==='sin_asignar')p=p.filter(o=>o.estado==='pendiente'&&!o.motorista_id);
  if(st.filtro==='entregados')p=p.filter(o=>o.estado==='entregado');
  if(st.filtro==='incidencias')p=p.filter(o=>['rechazado','no_responde','no_recibio','pasa_manana'].includes(o.estado));
  const q=st.busqueda.trim().toLocaleLowerCase('es');
  if(q)p=p.filter(o=>[o.numero_general,o.nombre_cliente,o.telefono_cliente,o.direccion_cliente,stores.find(t=>t.id===o.tienda_id)?.codigo].some(v=>String(v??'').toLocaleLowerCase('es').includes(q)));
  return p;
 }
 // ---------- pantalla ----------
 function pintar(){const box=$$('dyDesp');if(!box)return;
  const cM=contar('manana'),cT=contar('tarde'),cS=contar('sin_definir');
  if(!st.turno)st.turno=cM||cT?(cM>=cT?'manana':'tarde'):(new Date().getHours()<12?'manana':'tarde');
  box.innerHTML='<div class="dy-fecha-head"><div><h3>🗺️ Rutas por fecha</h3><p class="sub">Consultá una jornada, elegí el turno y revisá sus pedidos.</p></div><div class="dy-date-actions"><button type="button" id="dyDPrev" title="Día anterior">◀</button><input type="date" id="dyDFecha" value="'+st.fecha+'" max="'+hoy()+'" aria-label="Fecha de la ruta"><button type="button" id="dyDNext" '+(st.fecha>=hoy()?'disabled':'')+' title="Día siguiente">▶</button><button type="button" id="dyDHoy">Hoy</button></div></div>'
  +(editable()?'<p class="sub">Para repartir: optimizá, marcá los pedidos, elegí la moto y asigná.</p>':'<div class="dy-readonly">📅 Jornada histórica — solo consulta. No se pueden optimizar ni asignar pedidos en esta fecha.</div>')
  +'<div class="fila" id="dyDT">'+[['manana','🌅 Mañana',cM],['tarde','🌇 Tarde',cT]].concat(cS?[['sin_definir','Sin turno',cS]]:[]).map(([v,l,c])=>'<button type="button" class="chip '+(st.turno===v?'on':'')+'" data-t="'+v+'">'+l+' <small>'+c+' sin asignar</small></button>').join('')
  +'<button type="button" class="opt" id="dyDGo" '+(editable()?'':'disabled')+'>📍 Optimizar ruta desde mi ubicación</button></div>'
  +'<button type="button" class="link" id="dyDOtro">'+(st.manual?'Usar mi ubicación (GPS)':'Salir desde otro punto…')+'</button>'
  +(st.manual?'<div class="orig"><input id="dyDOrig" placeholder="Coordenadas: -25.30,-57.60 o enlace de Maps con coordenadas" value="'+(st.origen?st.origen.lat.toFixed(6)+','+st.origen.lng.toFixed(6):'')+'"></div>':'')
  +'<div class="dy-filtro-bar"><input id="dyBuscar" type="search" placeholder="Buscar número, cliente, teléfono o tienda" aria-label="Buscar pedido en esta fecha y turno"><div class="dy-filtro-botones">'+[['pendientes','Por realizar'],['sin_asignar','Sin asignar'],['entregados','Entregados'],['incidencias','Incidencias'],['todos','Todos']].map(([v,n])=>'<button type="button" data-dy-filtro="'+v+'" class="'+(st.filtro===v?'on':'')+'">'+n+'</button>').join('')+'</div><div id="dyResumenTurno"></div></div>'
  +'<div id="dyDAv"></div><div class="msg" id="dyDMsg"></div>'
  +'<div class="dy-map-toolbar"><strong>Mapa de reparto</strong><span id="dyMapProvider" role="status">Verificando Google Maps…</span><button type="button" id="dyMapFocus">Centrar en pedidos</button><span class="dy-map-hint">Verde: entregado · Rojo: rechazado · Azul: pendiente</span></div><div class="zona"><div class="lista" id="dyDList"></div><div id="dyMap"></div></div>'
  +'<div id="dyBarra"></div>';
  $('dyDPrev').onclick=()=>moverFecha(-1);$('dyDNext').onclick=()=>moverFecha(1);$('dyDHoy').onclick=()=>escogerFecha(hoy());$('dyDFecha').onchange=e=>escogerFecha(e.target.value);
  box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.turno=b.dataset.t;st.sel.clear();st.fit=false;pintar()});
  $('dyDOtro').onclick=()=>{st.manual=!st.manual;pintar()};$('dyDGo').onclick=optimizar;
  $('dyBuscar').oninput=e=>{st.busqueda=e.target.value;st.sel.clear();refrescar()};
  box.querySelectorAll('[data-dy-filtro]').forEach(b=>b.onclick=()=>{st.filtro=b.dataset.dyFiltro;st.sel.clear();refrescar()});
  if(st.mapObservador){st.mapObservador.disconnect();st.mapObservador=null}st.map=null;st.objs=[];iniciarMapa();refrescar()}
 function refrescar(){const ps=paradas(),vistos=visiblesTurno();
  // limpiar selección de lo que ya no se puede asignar
  [...st.sel].forEach(id=>{if(!libre(orders.find(o=>o.id===id)))st.sel.delete(id)});
  const sinNum=ps.filter(o=>o.numero_general==null&&o.estado==='pendiente'&&!o.motorista_id),sinGps=ps.filter(o=>!gps(o));
  $$('dyDAv').innerHTML=(sinNum.filter(gps).length?'<div class="aviso" style="background:#fff1f1;border-color:#f3a3a3">🆕 '+(sinNum.filter(gps).length===1?'Pedido nuevo':sinNum.filter(gps).length+' pedidos nuevos')+': <b>'+sinNum.filter(gps).slice(0,6).map(o=>esc(o.nombre_cliente)).join(', ')+'</b>'+(sinNum.filter(gps).length>6?'…':'')+' · tocá <b>📍 Optimizar ruta</b> para '+(ps.some(o=>o.motorista_id)?'sumarlos al final de la ruta':'ordenarlos')+'.</div>':'')+(otrosHtml()?'<details class="dy-otros-turnos"><summary>📋 Hay pedidos de otros turnos · ver y gestionar</summary>'+otrosHtml()+'</details>':'')+(sinGps.length?'<div class="aviso">⚠️ '+sinGps.length+' sin ubicación, no entran en el mapa: '+sinGps.slice(0,4).map(o=>esc(o.nombre_cliente)).join(', ')+(sinGps.length>4?'…':'')+'.</div>':'');
  $$('dyDAv').querySelectorAll('[data-pasar]').forEach(b=>b.onclick=()=>pasar(b.dataset.pasar));$$('dyDAv').querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{st.turno=b.dataset.ver;st.sel.clear();st.fit=false;pintar()});
  const elSum=$('dyResumenTurno');
  if(elSum){const pendientes=ps.filter(o=>!FIN.includes(o.estado)).length,entregados=ps.filter(o=>o.estado==='entregado').length,inc=ps.filter(o=>['rechazado','no_responde','no_recibio','pasa_manana'].includes(o.estado)).length;
   elSum.textContent='Turno '+(st.turno==='manana'?'Mañana':st.turno==='tarde'?'Tarde':'Sin definir')+': '+ps.length+' pedidos · '+pendientes+' por realizar · '+entregados+' entregados · '+inc+' incidencias · '+ps.filter(gps).length+' con GPS';
  }

  +(vistos.map(o=>{const d=drivers.find(x=>x.id===o.motorista_id);const col=d?colorMoto(d.id):null;const ok=libre(o),sel=st.sel.has(o.id);
   const est=o.estado==='entregado'?'<span class="pill" style="background:#2b8a3e">✓ Entregado</span>':o.estado!=='pendiente'?'<span class="pill" style="background:#c92a2a">'+esc(o.estado.replaceAll('_',' '))+'</span>':'';
   return '<label class="stop '+(sel?'sel ':'')+(d?'asig':'')+'" data-id="'+esc(o.id)+'" style="'+(d?'border-left-color:'+col:'')+'"><input type="checkbox" '+(sel?'checked':'')+' '+(ok?'':'disabled')+' data-ck="'+esc(o.id)+'" aria-label="Marcar pedido '+esc(o.numero_general??'')+'"><span class="num" style="background:'+(sel?'#f5a000':o.estado==='entregado'?'#16803c':o.estado==='rechazado'?'#dc2626':o.estado==='no_responde'?'#eab308':o.estado==='no_recibio'?'#ea580c':o.estado==='pasa_manana'?'#2563eb':col||(o.numero_general!=null?'#1f3a63':'#94a3b8'))+'">'+esc(o.numero_general??'—')+'</span><span class="t"><b>'+esc(o.nombre_cliente)+'</b><small>'+esc(stores.find(t=>t.id===o.tienda_id)?.codigo||'')+(o.direccion_cliente?' · '+esc(o.direccion_cliente):'')+'</small>'+(d?'<br><span class="pill" style="background:'+col+'">🏍️ '+esc(d.nombre)+'</span> ':'')+est+(window.dyNota?dyNota(o):'')+(editable()&&o.estado==='pendiente'?'<button type="button" class="link" data-dyedit="'+esc(o.id)+'" style="font-size:13px;padding:4px 0">✏️ Editar</button>':'')+'</span></label>'}).join('')||'<p class="sub" style="padding:12px">'+(ps.length?'Este filtro no tiene pedidos. Hay '+ps.length+' pedidos en el turno; el mapa sigue mostrando todos. Elegí «Todos» para verlos en la lista.':'No hay pedidos en este turno.')+'</p>');
  $$('dyDList').querySelectorAll('[data-ck]').forEach(c=>c.onchange=()=>{c.checked?st.sel.add(c.dataset.ck):st.sel.delete(c.dataset.ck);refrescar()});
  $$('dyDTodos').onclick=()=>{libres.forEach(o=>st.sel.add(o.id));refrescar()};$$('dyDNinguno').onclick=()=>{st.sel.clear();refrescar()};
  barra(ps);dibujar(ps);st.firma=firma()}
 function barra(ps){const el=$$('dyBarra');if(!el)return;const selOs=ps.filter(o=>st.sel.has(o.id));const act=drivers.filter(d=>d.activo);
  if(st.moto&&!act.some(d=>d.id===st.moto))st.moto=null;
  const nums=selOs.map(o=>o.numero_general);const k=largo(selOs.filter(gps),null);

 function recuperarMapaDespacho(){

<script id="dyAtrasJs">
window.__dyAtrasCfg={inicio:'Inicio',claveUltima:'dyf-central-pantalla',
 ir:s=>{try{page(s)}catch(_){}document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.textContent.trim()===s))},
 observar:cb=>{const cont=document.getElementById('content');if(!cont)return;let u=null,t0=0,manual=false,ultimo=null,restaurando=false;try{u=localStorage.getItem('dyf-central-pantalla')}catch(_){}
   const nombre=()=>{const h=cont.querySelector('h2');const t=(h&&h.textContent||'').trim();if(typeof pages!=='undefined'&&pages.includes(t))return t;if(/operaciones/i.test(t))return 'Inicio';return null};
   const ver=()=>{const n=nombre();if(!n||n===ultimo)return;ultimo=n;if(!t0)t0=Date.now();
     // al arrancar la Central muestra Inicio (a veces más de una vez): volvemos a la última pantalla usada
     if(n==='Inicio'&&!manual&&u&&u!=='Inicio'&&Date.now()-t0<8000&&typeof pages!=='undefined'&&pages.includes(u)){restaurando=true;setTimeout(()=>{window.__dyAtrasCfg.ir(u);restaurando=false},0);return}
     if(!restaurando&&n!=='Inicio')manual=true;cb(n)};new MutationObserver(ver).observe(cont,{childList:true});ver()}};
// Botón ◁ Atrás del teléfono: cierra la ventana abierta, vuelve a la pantalla anterior
// y en la principal pide tocar otra vez para salir. Usa el historial del navegador.
(function(){
 const C=window.__dyAtrasCfg;if(!C)return;
 let cur=null,restaurando=false,listo=false,salirHasta=0,tGuard=null;
 const est=(s,extra)=>Object.assign({dy:1,s},extra||{});
 function aviso(t){let e=document.getElementById('dyAtrasAviso');if(!e){e=document.createElement('div');e.id='dyAtrasAviso';e.style.cssText='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827ee;color:#fff;padding:11px 18px;border-radius:999px;font:600 15px system-ui,sans-serif;z-index:2147483000;box-shadow:0 6px 18px #0005;pointer-events:none;max-width:90vw;text-align:center';document.body.append(e)}e.textContent=t;e.style.opacity='1';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.opacity='0'},2300)}
 // Ventana encima: la de más arriba que cubre la pantalla.
 function ventana(){let best=null,bz=-Infinity;const vw=innerWidth,vh=innerHeight;
  for(const el of document.querySelectorAll('body *')){if(el.id==='dyAtrasAviso')continue;const cs=getComputedStyle(el);if(cs.position!=='fixed'||cs.display==='none'||cs.visibility==='hidden'||el.hidden)continue;
   const r=el.getBoundingClientRect();if(r.width<vw*.9||r.height<vh*.9)continue;if((C.ignorar||[]).some(sel=>el.matches(sel)))continue;
   const z=parseInt(cs.zIndex)||0;if(z>=bz){bz=z;best=el}}return best}
 function cerrarVentana(){const v=ventana();if(!v)return false;
  const b=v.querySelector('[data-cancel],#eX,#dyMCancel,#closeOrder,.dy-x,[aria-label="Cerrar"],#dyAvisoOk');
  if(b&&b.id!=='dyAvisoOk'){b.click()}else{v.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))}
  const sigue=v.isConnected&&!v.hidden&&getComputedStyle(v).display!=='none';
  if(sigue&&C.cerrarExtra)return C.cerrarExtra(v);
  return !sigue}
 function marcar(s){if(!s)return;if(!listo){listo=true;cur=s;history.replaceState(est(C.inicio,{root:1}),'');history.pushState(est(s,{g:1}),'');guardar(s);return}
  if(restaurando||s===cur){cur=s;return}history.pushState(est(s),'');cur=s;guardar(s)}
 function guardar(s){if(C.claveUltima){try{localStorage.setItem(C.claveUltima,s)}catch(_){}}}
 function ir(s){restaurando=true;try{C.ir(s)}catch(_){}cur=s;restaurando=false}
 addEventListener('popstate',e=>{if(!listo)return;const st=e.state;
  if(cerrarVentana()){history.pushState(est(cur),'');return}
  if(st&&st.dy&&!st.root){clearTimeout(tGuard);if(st.s!==cur)ir(st.s);return}
  // llegó a la base: primero a la pantalla principal, después pedir confirmación para salir
  if(cur!==C.inicio){ir(C.inicio);history.pushState(est(C.inicio,{g:1}),'');return}
  if(Date.now()<salirHasta){history.back();return}
  salirHasta=Date.now()+2500;aviso('Tocá ◁ Atrás otra vez para salir');
  clearTimeout(tGuard);tGuard=setTimeout(()=>{if(history.state&&history.state.root)history.pushState(est(C.inicio,{g:1}),'')},2600)});
 window.dyAtrasMarcar=marcar;window.dyAtrasEstado=()=>({cur,listo});
 C.observar(s=>marcar(s));
})();
</script>

<script id="dyPorTiendaJs">
// Central › Inicio: cuántos pedidos mandó cada tienda y en qué estado están.
(function(){let per='hoy';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dia=d=>new Date(d).toLocaleDateString('sv-SE',{timeZone:'America/Asuncion'});
 function filas(){const hoy=typeof filtroDia!=='undefined'?filtroDia:dia(Date.now()),desde=Date.parse(hoy+'T12:00:00Z')-6*864e5;const INC=['no_responde','no_recibio','pasa_manana'];
  const sel=(typeof orders!=='undefined'?orders:[]).filter(o=>o.estado!=='cancelado'&&(per==='hoy'?(dia(o.created_at)===hoy):Date.parse(o.created_at)>=desde&&dia(o.created_at)<=hoy));
  const m=new Map();sel.forEach(o=>{let r=m.get(o.tienda_id);if(!r){r={env:0,asig:0,cam:0,ent:0,rec:0,inc:0};m.set(o.tienda_id,r)}r.env++;
   if(o.estado==='pendiente'&&!o.motorista_id)r.asig++;else if(o.estado==='pendiente')r.cam++;else if(o.estado==='entregado')r.ent++;else if(o.estado==='rechazado')r.rec++;else if(INC.includes(o.estado))r.inc++});
  return [...m.entries()].map(([id,r])=>{const t=(typeof stores!=='undefined'?stores:[]).find(x=>x.id===id);return {id,n:t?(t.codigo||'')+' · '+(t.nombre_comercial||''):'Tienda',...r}}).sort((a,b)=>b.env-a.env)}
 function pintar(box){const fs=filas();const T=fs.reduce((a,r)=>{for(const k of ['env','asig','cam','ent','rec','inc'])a[k]+=r[k];return a},{env:0,asig:0,cam:0,ent:0,rec:0,inc:0});

  +(fs.length?'<div class="scroll"><table><thead><tr><th>Tienda</th><th>Enviados</th><th>Por asignar</th><th>En camino</th><th>Entregados</th><th>Rechazados</th><th>Incidencias</th></tr></thead><tbody>'+fs.map(r=>'<tr><td><button type="button" class="dy-shop-open" data-dytienda="'+esc(r.id)+'">'+esc(r.n)+' →</button></td><td><b>'+r.env+'</b></td><td>'+r.asig+'</td><td>'+r.cam+'</td><td>'+r.ent+'</td><td>'+r.rec+'</td><td>'+r.inc+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted" style="padding:0 16px 14px">Todavía no hay pedidos en este período.</p>');
  box.querySelectorAll('[data-p]').forEach(b=>b.onclick=e=>{e.preventDefault();per=b.dataset.p;pintar(box)});box.querySelectorAll('[data-dytienda]').forEach(b=>b.onclick=()=>{window.dyPedidoTiendaFiltro=b.dataset.dytienda;page('Pedidos')})}
 function montar(){const c=document.getElementById('content');if(!c)return;const h=c.querySelector('h2');if(!h||!/operaciones/i.test(h.textContent)){return}
  let box=document.getElementById('dyPorTienda');if(!box){box=document.createElement('details');box.id='dyPorTienda';box.open=true;const ult=[...c.querySelectorAll('details.dy-fold')].pop();if(document.querySelector('.dy-shop-shortcuts'))document.querySelector('.dy-shop-shortcuts').after(box);else if(ult)ult.after(box);else{const hd=h.closest('div')||h;hd.after(box)}}pintar(box)}
 const c=document.getElementById('content');if(c)new MutationObserver(()=>{if(!document.getElementById('dyPorTienda'))montar()}).observe(c,{childList:true});
 let firma='';setInterval(()=>{const b=document.getElementById('dyPorTienda');if(!b||typeof orders==='undefined')return;const f=orders.map(o=>o.id+o.estado+(o.motorista_id||'')).join('|');if(f!==firma){firma=f;pintar(b)}},3000);
