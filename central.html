async function start(){const {data:{session}}=await client.auth.getSession();if(!session)return;const token=new URLSearchParams(location.search).get('invite');if(token){const result=await client.rpc('flota_aceptar_invitacion',{p_token:token});if(result.error){$('error').textContent='Invitación: '+result.error.message;}else{history.replaceState(null,'',location.pathname);}}const {data,error}=await client.from('flota_usuarios').select('*').eq('usuario_id',session.user.id).eq('activo',true).limit(1);if(error||!data?.length){const claimed=await client.rpc('flota_reclamar_propiedad');if(claimed.error){$('error').textContent='Cuenta autenticada, pero falta habilitación: '+claimed.error.message;return}const updated=await client.from('flota_usuarios').select('*').eq('usuario_id',session.user.id).eq('activo',true).limit(1);if(updated.error||!updated.data?.length){$('error').textContent='No se pudo completar la autorización';return}account=updated.data[0]}else{account=data[0]}const id=account.empresa_id;const r=await Promise.all([client.from('pedidos').select('*').eq('empresa_id',id).limit(1000),client.from('tiendas').select('*').eq('empresa_id',id),client.from('motoristas').select('*').eq('empresa_id',id),client.from('rendiciones').select('*').eq('empresa_id',id),client.from('movimientos_financieros').select('*').eq('empresa_id',id).limit(2000),client.from('flota_cierres_motoristas').select('*').eq('empresa_id',id).order('created_at',{ascending:false}).limit(200)]);if(r.some(x=>x.error)){$('error').textContent='La cuenta necesita permisos de lectura en Supabase.';return}[orders,stores,drivers,settlements,movements,closures]=r.map(x=>x.data||[]);$('login').classList.add('hidden');$('app').classList.remove('hidden');const visiblePages=pages.filter(p=>(p!=='Finanzas'||account.rol==='propietario'||account.puede_finanzas)&&(p!=='Usuarios y socios'||account.rol==='propietario'));$('nav').innerHTML=visiblePages.map((p,i)=>'<button data-i="'+i+'">'+p+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');page(visiblePages[+b.dataset.i])});page('Inicio')}
$('enter').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('error').textContent=error.message;return}start()};$('register').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8){$('error').textContent='Ingresá el correo autorizado y una contraseña nueva de al menos 8 caracteres.';return}const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/central.html'}});if(error){$('error').textContent=error.message;return}$('error').textContent=data.session?'Cuenta creada. Activando acceso…':'Registro solicitado. Revisá tu correo y confirmá la cuenta; después ingresá aquí.';if(data.session)await start()};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};start();
</script></body></html>
