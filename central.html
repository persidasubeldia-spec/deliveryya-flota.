<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeliveryYa Flota · Central</title><style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f3f6fa;color:#1b2c42}header{background:#142b4d;color:white;padding:18px}main{max-width:1150px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input{padding:10px;border:1px solid #bdcbd9;border-radius:8px;background:white}button{cursor:pointer}.card{background:white;border:1px solid #dfe5ed;padding:16px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.number{font-size:26px;font-weight:bold}.muted{color:#62738b}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #dde5ef;text-align:left}.scroll{overflow:auto}.notice{background:#fff4dc;padding:12px;border-left:4px solid #d39c18}</style></head><body>
<header><strong>DeliveryYa Flota</strong><div>Central de Mando</div></header><main><section id="login"><h2>Acceso administrativo</h2><p>Solo propietario, socios y operadores autorizados.</p><input id="email" type="email" placeholder="Correo" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="enter">Ingresar</button> <button id="register" type="button">Crear cuenta del propietario</button><p class="muted">Primera vez: creá tu cuenta y verificá el correo electrónico antes de ingresar.</p><p id="error"></p></section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div><button id="logout">Cerrar sesión</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=supabase.createClient('https://sxhuvjvbqkovivcbisrn.supabase.co','sb_publishable_aKiJpn8HK3tpqRuQkNc3CQ_YUi9EnGv');let account=null,orders=[],stores=[],drivers=[],settlements=[];const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const money=v=>'₲ '+Math.round(v||0).toLocaleString('es-PY');
const pages=['Inicio','Pedidos','Rutas','Motoristas','Tiendas','Finanzas','Usuarios y socios'];function table(head,rows){return '<div class="card scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function summary(name,val){return '<div class="card"><div class="muted">'+name+'</div><div class="number">'+val+'</div></div>'}
function page(n){let html='<h2>'+n+'</h2>';if(n==='Inicio')html='<h2>Resumen de la flota</h2><div class="grid">'+[['Pedidos',orders.length],['Pendientes',orders.filter(x=>x.estado==='pendiente').length],['Entregados',orders.filter(x=>x.estado==='entregado').length],['Motoristas activos',drivers.filter(x=>x.activo).length],['Tiendas activas',stores.filter(x=>x.activo).length],['Rendiciones registradas',settlements.length]].map(x=>summary(...x)).join('')+'</div>';
if(n==='Pedidos')html+=table(['Tienda','Cliente','Mercadería','Envío','Estado'],orders.map(o=>[escapeHtml(stores.find(x=>x.id===o.tienda_id)?.codigo||'—'),escapeHtml(o.nombre_cliente),money(o.precio_mercaderia),money(o.precio_delivery),escapeHtml(o.estado)]));
if(n==='Rutas'){html+='<div class="notice">Asignación controlada disponible para pedidos pendientes. La optimización vial todavía no está habilitada.</div>';html+=table(['N.º','Cliente','Motorista','Estado','Acción'],orders.map(o=>[escapeHtml(o.numero_general??'—'),escapeHtml(o.nombre_cliente),escapeHtml(drivers.find(x=>x.id===o.motorista_id)?.nombre||'Sin asignar'),escapeHtml(o.estado),o.estado==='pendiente'&&!o.motorista_id?'<button data-assign="'+escapeHtml(o.id)+'">Asignar</button>':'—']));}
if(n==='Motoristas'){html+='<div class="card"><h3>Agregar motorista</h3><p class="muted">El motorista se registra aquí para su administración; el acceso propio a App Motorista requiere una invitación y cuenta autorizada.</p><div class="grid"><input id="mname" placeholder="Nombre y apellido"><input id="mphone" placeholder="Teléfono WhatsApp"><input id="memail" type="email" placeholder="Correo electrónico"><input id="mcolor" type="color" value="#2980b9"><label>Comisión empresa (%) <input id="mpct" type="number" min="0" max="100" value="25"></label></div><p><button id="mcreate">Registrar motorista</button> <span id="mresult"></span></p></div>';html+=table(['Nombre','Teléfono','Empresa %','Estado'],drivers.map(d=>[escapeHtml(d.nombre),escapeHtml(d.telefono),escapeHtml(d.porcentaje_empresa_pct??25)+'%',d.activo?'Activo':'Inactivo']));}
if(n==='Tiendas')html+=table(['Código','Nombre','Estado'],stores.map(t=>[escapeHtml(t.codigo),escapeHtml(t.nombre_comercial),t.activo?'Activa':'Inactiva']));
if(n==='Usuarios y socios'){html+='<div class="card"><h3>Usuarios autorizados</h3><div id="team">Consultando…</div><h3>Invitar socio u operador</h3><div class="grid"><input id="uname" placeholder="Nombre"><input id="uemail" type="email" placeholder="Correo"><input id="uphone" placeholder="Teléfono"><select id="urole"><option value="socio">Socio</option><option value="operador">Operador</option></select></div><p><label><input id="ufin" type="checkbox"> Finanzas</label> <label><input id="ucom" type="checkbox"> Comisiones</label> <label><input id="umot" type="checkbox"> Motoristas</label> <label><input id="utie" type="checkbox"> Tiendas</label> <label><input id="uren" type="checkbox"> Confirmar rendiciones</label></p><button id="uinvit">Crear invitación</button><p id="uresult"></p></div>';}if(n==='Finanzas')html+='<div class="notice">Importes de pedidos no equivalen a dinero rendido. Esta pantalla no confirma cobros.</div>'+table(['Tipo','Fecha','A rendir','Estado'],settlements.map(x=>[escapeHtml(x.tipo),escapeHtml(x.fecha),money(x.total_a_rendir),escapeHtml(x.estado)]));
$('content').innerHTML=html;
if(n==='Usuarios y socios'){
 const list=$('team');if(account.rol!=='propietario'){list.textContent='Solo el propietario puede invitar y revocar usuarios';$('uinvit').disabled=true}
 else {
 client.rpc('flota_usuarios_listar',{p_empresa:account.empresa_id}).then(({data,error})=>{
 if(error){list.textContent=error.message;return}
 list.innerHTML=table(['Nombre','Correo','Rol','Estado','Acción'],(data||[]).map(u=>[escapeHtml(u.nombre),escapeHtml(u.correo),escapeHtml(u.rol),u.activo?'Activo':'Suspendido',u.rol!=='propietario'&&u.activo?'<button data-revoke="'+escapeHtml(u.usuario_id)+'">Revocar</button>':'—']));
 list.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{
 if(!confirm('¿Revocar acceso?'))return;
 b.disabled=true;
 const {error}=await client.rpc('flota_revocar_usuario',{p_empresa:account.empresa_id,p_usuario:b.dataset.revoke});
 if(error){alert(error.message);b.disabled=false;return}page('Usuarios y socios');
 });});
 $('uinvit').onclick=async()=>{
 const b=$('uinvit');b.disabled=true;
 const {data,error}=await client.rpc('flota_crear_invitacion',{p_empresa:account.empresa_id,p_correo:$('uemail').value.trim(),p_nombre:$('uname').value.trim(),p_rol:$('urole').value,p_telefono:$('uphone').value.trim(),p_finanzas:$('ufin').checked,p_comisiones:$('ucom').checked,p_motoristas:$('umot').checked,p_tiendas:$('utie').checked,p_rendiciones:$('uren').checked});
 b.disabled=false;
 if(error){$('uresult').textContent=error.message;return}
 $('uresult').textContent='Invitación: '+location.origin+'/central.html?invite='+encodeURIComponent(data);
 };}
}
if(n==='Motoristas'){$('mcreate').onclick=async()=>{
const b=$('mcreate');b.disabled=true;$('mresult').textContent='Guardando…';
const {error}=await client.rpc('flota_registrar_motorista',{p_empresa:account.empresa_id,p_nombre:$('mname').value,p_telefono:$('mphone').value,p_correo:$('memail').value,p_color:$('mcolor').value,p_pct:Number($('mpct').value)});
b.disabled=false;
if(error){$('mresult').textContent=error.message;return}
const r=await client.from('motoristas').select('*').eq('empresa_id',account.empresa_id);
if(r.error){$('mresult').textContent=r.error.message;return}
drivers=r.data||[];page('Motoristas');
}}
document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{const pedido=orders.find(x=>x.id===b.dataset.assign);const choices=drivers.filter(x=>x.activo);if(!choices.length){alert('Primero registrá un motorista activo.');return}const names=choices.map((x,i)=>(i+1)+'. '+x.nombre).join('\n');const chosen=prompt('Seleccioná número de motorista:\n'+names);if(!chosen)return;const motor=choices[Number(chosen)-1];if(!motor){alert('Motorista inválido');return}const number=pedido.numero_general||Number(prompt('Número de reparto (desde 1):','1'));if(!Number.isInteger(number)||number<1)return;const {error}=await client.rpc('admin_asignar_pedido_motorista',{p_pedido_id:pedido.id,p_motorista_id:motor.id,p_numero_general:number});if(error){alert('No se pudo asignar: '+error.message);return}pedido.motorista_id=motor.id;pedido.numero_general=number;page('Rutas')})}
async function start(){const {data:{session}}=await client.auth.getSession();if(!session)return;const token=new URLSearchParams(location.search).get('invite');if(token){const result=await client.rpc('flota_aceptar_invitacion',{p_token:token});if(result.error){$('error').textContent='Invitación: '+result.error.message;}else{history.replaceState(null,'',location.pathname);}}const {data,error}=await client.from('flota_usuarios').select('*').eq('usuario_id',session.user.id).eq('activo',true).limit(1);if(error||!data?.length){const claimed=await client.rpc('flota_reclamar_propiedad');if(claimed.error){$('error').textContent='Cuenta autenticada, pero falta habilitación: '+claimed.error.message;return}const updated=await client.from('flota_usuarios').select('*').eq('usuario_id',session.user.id).eq('activo',true).limit(1);if(updated.error||!updated.data?.length){$('error').textContent='No se pudo completar la autorización';return}account=updated.data[0]}else{account=data[0]}const id=account.empresa_id;const r=await Promise.all([client.from('pedidos').select('*').eq('empresa_id',id).limit(1000),client.from('tiendas').select('*').eq('empresa_id',id),client.from('motoristas').select('*').eq('empresa_id',id),client.from('rendiciones').select('*').eq('empresa_id',id)]);if(r.some(x=>x.error)){$('error').textContent='La cuenta necesita permisos de lectura en Supabase.';return}[orders,stores,drivers,settlements]=r.map(x=>x.data||[]);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').innerHTML=pages.map((p,i)=>'<button data-i="'+i+'">'+p+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>page(pages[+b.dataset.i]));page('Inicio')}
$('enter').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('error').textContent=error.message;return}start()};$('register').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8){$('error').textContent='Ingresá el correo autorizado y una contraseña nueva de al menos 8 caracteres.';return}const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/central.html'}});if(error){$('error').textContent=error.message;return}$('error').textContent=data.session?'Cuenta creada. Activando acceso…':'Registro solicitado. Revisá tu correo y confirmá la cuenta; después ingresá aquí.';if(data.session)await start()};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};start();
</script></body></html>
