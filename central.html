 const parseRouteOrigin=raw=>{
  const t=String(raw||'').trim();
  if(!t)return null;
  const match=t.match(/(?:@|[?&](?:q|query)=|^)(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!match)throw Error('Punto de salida inválido. Pegá latitud,longitud o enlace de Google Maps.');
  const lat=Number(match[1]),lng=Number(match[2]);
  if(Math.abs(lat)>90||Math.abs(lng)>180)throw Error('Las coordenadas de salida están fuera de rango.');
  return {lat,lng};
 };

let orderWatchBusy=false,orderRealtime=null;
function notifyNewOrders(items){

 document.title='('+newOrderAlerts.length+') Pedidos nuevos · DeliveryYa';

async function checkIncomingOrders(){
 if(!account||orderWatchBusy)return;
 orderWatchBusy=true;
 try{
  const {data,error}=await client.from('pedidos').select('id,empresa_id,tienda_id,nombre_cliente,created_at,estado').eq('empresa_id',account.empresa_id).order('created_at',{ascending:false}).limit(100);
  if(error)throw error;
  const known=new Set(orders.map(o=>o.id));
  const arrivals=(data||[]).filter(o=>!known.has(o.id));
  if(arrivals.length){
   const fresh=await cargarTodosLosPedidos(account.empresa_id);
   const stillNew=fresh.filter(o=>!known.has(o.id));
   orders=fresh;notifyNewOrders(stillNew);
   if($('newOrdersPanel'))page('Inicio');
  }
  lastOrderWatchError='';
  const status=$('newOrdersWatchStatus');if(status)status.textContent='Última comprobación: '+new Date().toLocaleTimeString('es-PY');
 }catch(e){lastOrderWatchError='Sin conexión para avisos: '+e.message;const status=$('newOrdersWatchStatus');if(status)status.textContent=lastOrderWatchError;}
 finally{orderWatchBusy=false;}
}
function beginOrderWatcher(){
 if(orderWatcherStarted)return;orderWatcherStarted=true;
 setInterval(checkIncomingOrders,15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkIncomingOrders();});
 window.addEventListener('online',checkIncomingOrders);
 try{orderRealtime=client.channel('central-pedidos-'+account.empresa_id).on('postgres_changes',{event:'INSERT',schema:'public',table:'pedidos',filter:'empresa_id=eq.'+account.empresa_id},()=>checkIncomingOrders()).subscribe();}catch(e){console.warn('Usando comprobación periódica de pedidos',e);}
}
let storeRequestPolling=false;

   const {data,error}=await client.rpc('flota_solicitudes_tienda_pendientes');

   const next=data||[];
   const before=pendingShopRequests.map(p=>p.id).sort().join(',');

   pendingShopRequests=next;
